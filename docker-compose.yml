
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fnol
      POSTGRES_USER: fnol
      POSTGRES_PASSWORD: fnol
    ports:
      # host port is configurable in case 5432 is already in use; the API connects over the compose network
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnol -d fnol"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-guidewire:
    build:
      context: .
      dockerfile: fnol-mock-guidewire/Dockerfile
    environment:
      SERVER_PORT: 9090
      # true delays ClaimCenter create by 11 s (trips the API's 3 s Guidewire read timeout after the fan-out)
      MOCK_GW_TIMEOUT: "${MOCK_GW_TIMEOUT:-false}"
      # true delays PolicyCenter coverages (Branch A) by 12 s (trips the 3 s read timeout inside the branch)
      MOCK_PC_TIMEOUT: "${MOCK_PC_TIMEOUT:-false}"
      # first ClaimCenter claim number; raise it after a restart so IDs do not collide with stored claims
      MOCK_CC_START_SEQUENCE: "${MOCK_CC_START_SEQUENCE:-1}"
    ports:
      - "9090:9090"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:9090/pc/policies/POL-AUTO-112233 >/dev/null
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 15s

  fnol-api:
    build:
      context: .
      dockerfile: fnol-api/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fnol
      SPRING_DATASOURCE_USERNAME: fnol
      SPRING_DATASOURCE_PASSWORD: fnol
      MOCK_GUIDEWIRE_BASE_URL: http://mock-guidewire:9090
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_VISION_ENABLED: "${GEMINI_VISION_ENABLED:-true}"
      GEMINI_VISION_MODEL: "${GEMINI_VISION_MODEL:-gemini-2.5-flash}"
      FNOL_ORCHESTRATOR_TIMEOUT_SECONDS: "${FNOL_ORCHESTRATOR_TIMEOUT_SECONDS:-10}"
      FNOL_STP_REQUIRE_ADVISORY_REVIEW: "${FNOL_STP_REQUIRE_ADVISORY_REVIEW:-true}"
      # Empty token = adjuster endpoints (review, audit, explanation, queue) reject every request.
      FNOL_ADJUSTER_TOKEN: "${FNOL_ADJUSTER_TOKEN:-}"
      FNOL_CORS_ALLOWED_ORIGINS: "${FNOL_CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
      FNOL_EVIDENCE_ALLOWED_HOSTS: "${FNOL_EVIDENCE_ALLOWED_HOSTS:-}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-guidewire:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/api/v1/health >/dev/null
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_ADJUSTER_TOKEN: "${FNOL_ADJUSTER_TOKEN:-}"
    ports:
      - "5173:5173"
    depends_on:
      fnol-api:
        condition: service_healthy
