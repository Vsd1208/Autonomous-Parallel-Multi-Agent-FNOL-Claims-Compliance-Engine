services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fnol
      POSTGRES_USER: fnol
      POSTGRES_PASSWORD: fnol
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U fnol -d fnol"]
      interval: 5s
      timeout: 3s
      retries: 10
  mock-guidewire:
    build:
      context: .
      dockerfile: fnol-mock-guidewire/Dockerfile
    environment:
      SERVER_PORT: 9090
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:9090/pc/policies/POL-AUTO-112233 >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10
  fnol-api:
    build:
      context: .
      dockerfile: fnol-api/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fnol
      SPRING_DATASOURCE_USERNAME: fnol
      SPRING_DATASOURCE_PASSWORD: fnol
      MOCK_GUIDEWIRE_BASE_URL: http://mock-guidewire:9090
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      mock-guidewire:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/api/v1/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports: ["5173:5173"]
    depends_on:
      fnol-api:
        condition: service_healthy
