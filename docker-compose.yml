
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fnol
      POSTGRES_USER: fnol
      POSTGRES_PASSWORD: fnol
    ports:
      # host port is configurable in case 5432 is already in use; the API connects over the compose network
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # FNOL claims, audit chain and evidence, plus the mock ClaimCenter (schema "claimcenter")
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnol -d fnol"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-guidewire:
    build:
      context: .
      dockerfile: fnol-mock-guidewire/Dockerfile
    environment:
      SERVER_PORT: 9090
      # true delays ClaimCenter create by 11 s (trips the API's 3 s Guidewire read timeout after the fan-out)
      MOCK_GW_TIMEOUT: "${MOCK_GW_TIMEOUT:-false}"
      # true delays PolicyCenter coverages (Branch A) by 12 s (trips the 3 s read timeout inside the branch)
      MOCK_PC_TIMEOUT: "${MOCK_PC_TIMEOUT:-false}"
      # lowest first ClaimCenter claim number; numbering otherwise continues after the highest stored claim
      MOCK_CC_START_SEQUENCE: "${MOCK_CC_START_SEQUENCE:-1}"
      # Mock ClaimCenter claims live in Postgres (schema "claimcenter"), so restarts keep them
      MOCK_CC_DB_URL: jdbc:postgresql://postgres:5432/fnol
      MOCK_CC_DB_USERNAME: fnol
      MOCK_CC_DB_PASSWORD: fnol
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9090:9090"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:9090/pc/policies/POL-AUTO-112233 >/dev/null
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 15s

  vision-ml:
    # Second-opinion vision model (CLIP + trained head, tools/second-opinion). No published port: only the API calls
    # it, over the compose network. The first build downloads PyTorch (CPU) and the CLIP weights (~1 GB in total).
    build:
      context: fnol-vision-ml
    environment:
      TORCH_THREADS: "${VISION_ML_THREADS:-2}"

  fnol-api:
    build:
      context: .
      dockerfile: fnol-api/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fnol
      SPRING_DATASOURCE_USERNAME: fnol
      SPRING_DATASOURCE_PASSWORD: fnol
      MOCK_GUIDEWIRE_BASE_URL: http://mock-guidewire:9090
      GUIDEWIRE_AUTH_BEARER_TOKEN: "${GUIDEWIRE_AUTH_BEARER_TOKEN:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_VISION_ENABLED: "${GEMINI_VISION_ENABLED:-true}"
      GEMINI_VISION_MODEL: "${GEMINI_VISION_MODEL:-gemini-2.5-flash}"
      FNOL_ORCHESTRATOR_TIMEOUT_SECONDS: "${FNOL_ORCHESTRATOR_TIMEOUT_SECONDS:-10}"
      FNOL_STP_REQUIRE_ADVISORY_REVIEW: "${FNOL_STP_REQUIRE_ADVISORY_REVIEW:-true}"
      # Empty token = adjuster endpoints (review, audit, explanation, queue) reject every request.
      FNOL_ADJUSTER_TOKEN: "${FNOL_ADJUSTER_TOKEN:-}"
      # Adjuster workspace (5173) and policyholder portal (5174)
      FNOL_CORS_ALLOWED_ORIGINS: "${FNOL_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}"
      # One-time upload links sent to claimants open the portal
      FNOL_PORTAL_BASE_URL: "${FNOL_PORTAL_BASE_URL:-http://localhost:5174}"
      FNOL_EVIDENCE_ALLOWED_HOSTS: "${FNOL_EVIDENCE_ALLOWED_HOSTS:-}"
      # Second-opinion model; empty turns it off (the MODEL_DISAGREEMENT check then never runs).
      FNOL_SECOND_OPINION_URL: "${FNOL_SECOND_OPINION_URL:-http://vision-ml:8090}"
      # Faces and licence plates are blurred here before any photo goes to Gemini. With REQUIRED=true no photo is
      # sent when blurring is unavailable (the claim goes to an adjuster). Empty URL turns redaction off.
      FNOL_REDACTION_URL: "${FNOL_REDACTION_URL:-http://vision-ml:8090}"
      FNOL_REDACTION_REQUIRED: "${FNOL_REDACTION_REQUIRED:-true}"
    ports:
      # Override API_HOST_PORT when another server (e.g. Apache) already uses 8080 on the host.
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-guidewire:
        condition: service_healthy
      vision-ml:
        # Started is enough: until the model is ready the API simply works without the second opinion.
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/api/v1/health >/dev/null
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:${API_HOST_PORT:-8080}"
        VITE_ADJUSTER_TOKEN: "${FNOL_ADJUSTER_TOKEN:-}"
        VITE_PORTAL_URL: "${FNOL_PORTAL_BASE_URL:-http://localhost:5174}"
    ports:
      - "5173:5173"
    depends_on:
      fnol-api:
        condition: service_healthy

  portal:
    # Policyholder claims portal: report a loss, track a claim, add requested photos. A separate build from the
    # adjuster workspace that never receives the adjuster token; it calls only /api/v1/portal and /api/v1/public.
    build:
      context: .
      dockerfile: frontend/portal.Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:${API_HOST_PORT:-8080}"
    ports:
      - "5174:5174"
    depends_on:
      fnol-api:
        condition: service_healthy

volumes:
  postgres_data:
