server:
  port: ${SERVER_PORT:8080}
mock-guidewire:
  base-url: ${MOCK_GUIDEWIRE_BASE_URL:http://localhost:9090}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fnol}
    username: ${SPRING_DATASOURCE_USERNAME:fnol}
    password: ${SPRING_DATASOURCE_PASSWORD:fnol}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
